# ============================================================
# GitHub Actions CI/CD Workflow
# RaceDay - Part 1
# ============================================================

name: Validate Docs Folder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check-docs:
    name: Check Required Files in /docs
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: List repository contents
      - name: Show repository contents
        shell: pwsh
        run: |
          Write-Host "Root folder contents:"
          Get-ChildItem -Path "." | Format-Table Name, LastWriteTime
          if (Test-Path -Path "docs") {
            Write-Host "docs folder contents:"
            Get-ChildItem -Path "docs" | Format-Table Name, Length, LastWriteTime
          } else {
            Write-Host "No docs folder found - will be added soon."
          }

      # Step 3: All done
      - name: Build successful
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "SUCCESS: RaceDay Part 1 workflow passed!"
          Write-Host "============================================"

