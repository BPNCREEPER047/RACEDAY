name: RaceDay Auto Commits

on:
  workflow_dispatch:  # Trigger manually from GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allow the workflow to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "BPNCREEPER047"
          git config user.email "BPNCREEPER047@users.noreply.github.com"

      - name: Make script executable
        run: chmod +x make_commits.sh

      - name: Run commit script
        run: ./make_commits.sh

      - name: Push all commits
        run: git push origin main
